# Baut die App auf einem Mac von GitHub (ohne Signatur, für den Simulator).
# So zeigen sich Compiler-Fehler in jedem Pull Request, auch ohne eigenen Mac.
name: iOS-Build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Bauen (Simulator, ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild build \
            -project FitScan.xcodeproj \
            -target FitScan \
            -sdk iphonesimulator \
            -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Fehler anzeigen
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100 || true
