# Baut die App auf einem Mac von GitHub (ohne Signatur, für den Simulator).
# So zeigen sich Compiler-Fehler in jedem Pull Request, auch ohne eigenen Mac.
name: iOS-Build

# Mac-Minuten zählen bei GitHub zehnfach: nur bauen, wenn sich App oder Projekt ändern.
# Auf main nicht noch einmal, denn der Pull Request wurde schon gebaut.
on:
  pull_request:
    paths:
      - "FitScan/**"
      - "Shared/**"
      - "BFCWidgets/**"
      - "BFCWidgets-Info.plist"
      - "BFCWidgets.entitlements"
      - "FitScan.xcodeproj/**"
      - "BFC-Info.plist"
      - "FitScan.entitlements"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Projektformat für dieses Xcode
        # Das Projekt ist mit einem neueren Xcode gespeichert (Format 110); die Mac-Runner haben höchstens Xcode 26.
        # Inhaltlich passt Format 77 (preferredProjectObjectVersion), deshalb nur für den Build umstellen.
        run: sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' FitScan.xcodeproj/project.pbxproj
      - name: Bauen (Simulator, ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild build \
            -project FitScan.xcodeproj \
            -target FitScan \
            -sdk iphonesimulator \
            -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Fehler anzeigen
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -100 || true
