# Startet die App im iPhone-Simulator auf einem Mac von GitHub und tippt sich durch alle Bereiche (uitests/).
# Ergebnis als Artefakt „simulator-rundgang“: Bildschirmfotos, Video, App-Protokoll und ggf. Absturzberichte.
name: iOS-Simulator-Test

# Der Rundgang dauert auf dem Mac rund 10 bis 20 Minuten (zählt zehnfach): deshalb nicht bei jedem Pull Request,
# sondern nur nach Änderungen an der App auf main oder von Hand (Actions → iOS-Simulator-Test → Run workflow).
on:
  push:
    branches: [ "main" ]
    paths:
      - "FitScan/**"
      - "FitScan.xcodeproj/**"
      - "uitests/**"
  workflow_dispatch:

permissions:
  # write: Bilder werden zusätzlich auf den Zweig simulator-bilder/<pr-oder-main> gelegt, damit man sie direkt auf GitHub ansehen kann
  contents: write

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rundgang:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Projektformat für dieses Xcode
        # Wie im iOS-Build: das Projekt ist mit einem neueren Xcode gespeichert
        run: sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' FitScan.xcodeproj/project.pbxproj
      - name: iPhone-Simulator auswählen und starten
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-26")) | .value[] | select(.name | test("^iPhone"))]
            | (map(select(.name | test("Pro$"))) + .) | .[0].udid')
          NAME=$(xcrun simctl list devices | grep "$UDID" | head -1)
          echo "Simulator: $NAME"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --batteryState charged || true
      - name: App bauen (Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project FitScan.xcodeproj -target FitScan -sdk iphonesimulator -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: App im Simulator installieren
        run: xcrun simctl install "$UDID" build/Debug-iphonesimulator/FitScan.app
      - name: Test-Projekt erzeugen
        run: |
          brew install xcodegen
          cd uitests && xcodegen
      - name: Rundgang mit Video
        id: rundgang
        continue-on-error: true
        run: |
          mkdir -p out/bilder
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force out/rundgang.mp4 & VIDEO=$!
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "FitScan"' > out/app-protokoll.txt 2>&1 & LOG=$!
          sleep 2
          set +e
          # TEST_RUNNER_-Variablen gibt xcodebuild als Umgebung an den Test weiter
          TEST_RUNNER_BFC_SHOTS="$PWD/out/bilder" xcodebuild test \
            -project uitests/BFCUITests.xcodeproj -scheme BFCUITests \
            -destination "id=$UDID" -resultBundlePath out/rundgang.xcresult \
            2>&1 | tee out/test.log | grep -E "RUNDGANG|error:|failed|passed|Test Suite|TEST (SUCCEEDED|FAILED)"
          RESULT=${PIPESTATUS[0]}
          kill -INT $VIDEO; kill $LOG; wait $VIDEO
          # Falls der Test keine Bilder direkt schreiben konnte: aus dem Testergebnis holen
          if ! ls out/bilder/*.png >/dev/null 2>&1; then
            mkdir -p out/xcanhang
            xcrun xcresulttool export attachments --path out/rundgang.xcresult --output-path out/xcanhang || true
            if [ -f out/xcanhang/manifest.json ]; then
              jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' out/xcanhang/manifest.json |
                while IFS=$'\t' read -r file name; do
                  base="${name%%_*}"; [ -n "$base" ] || base="$file"
                  cp "out/xcanhang/$file" "out/bilder/${base%.png}.png"
                done
            fi
          fi
          # Video verkleinern, damit es auf GitHub angesehen werden kann
          cp out/bilder/*.txt pub/bilder/ 2>/dev/null || true
          if [ -f out/rundgang.mp4 ]; then
            avconvert --source out/rundgang.mp4 --output out/rundgang-klein.mp4 --preset Preset960x540 --replace > out/avconvert.txt 2>&1 || true
            [ -s out/rundgang-klein.mp4 ] && mv out/rundgang-klein.mp4 out/rundgang.mp4
          fi
          ls -la out out/bilder
          exit $RESULT
      - name: Absturzberichte einsammeln
        if: always()
        run: |
          mkdir -p out/abstuerze
          cp ~/Library/Logs/DiagnosticReports/FitScan* out/abstuerze/ 2>/dev/null || true
          ls out/bilder out/abstuerze
      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "# Simulator-Rundgang"
            echo
            echo "Commit: ${GITHUB_SHA::7} · Ergebnis: ${{ steps.rundgang.outcome }}"
            echo
            echo "## Fehler und Hinweise"
            echo '```'
            grep -E "RUNDGANG|error:|XCTAssert|failed \(|Test Case .* (passed|failed)" out/test.log | sed 's/^.*RundgangTests.swift/RundgangTests.swift/' | head -80
            echo '```'
            if ls out/abstuerze/* >/dev/null 2>&1; then
              echo "## Absturzberichte"
              for f in out/abstuerze/*; do echo "### $(basename "$f")"; echo '```'; head -c 6000 "$f"; echo; echo '```'; done
            fi
            echo "## App-Protokoll (Fehler und Warnungen)"
            echo '```'
            grep -vE "com.apple.dt.xctest|XC_kAX|error: \(null\)" out/app-protokoll.txt | grep -iE "error|fault|warning|crash|fatal|exception" | cut -c25-300 | sort | uniq -c | sort -rn | head -60
            echo '```'
            echo "## Dateien"
            echo '```'
            ls -la out out/bilder | head -80
            cat out/avconvert.txt 2>/dev/null | tail -5
            echo '```'
          } > out/ERGEBNIS.md
          cat out/ERGEBNIS.md
          grep -E "RUNDGANG|error:" out/test.log | head -20 | while read -r line; do echo "::warning::${line}"; done
      - name: Bilder auf Zweig legen
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}"
          BRANCH="simulator-bilder/$REF"
          mkdir -p pub/bilder
          cp out/ERGEBNIS.md pub/README.md
          echo "## Bildschirmfotos" >> pub/README.md
          for f in out/bilder/*.png; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .png)
            sips -s format jpeg -s formatOptions 70 -Z 1000 "$f" --out "pub/bilder/$n.jpg" >/dev/null
            printf '\n**%s**\n\n<img src="bilder/%s" width="300">\n' "$n" "$(echo "$n.jpg" | sed 's/ /%20/g')" >> pub/README.md
          done
          cp out/bilder/*.txt pub/bilder/ 2>/dev/null || true
          if [ -f out/rundgang.mp4 ] && [ $(stat -f%z out/rundgang.mp4) -lt 95000000 ]; then cp out/rundgang.mp4 pub/; echo -e "\n[Video vom Rundgang](rundgang.mp4)" >> pub/README.md; fi
          cd pub
          git init -q -b "$BRANCH"
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Simulator-Rundgang ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"
          echo "Bilder: https://github.com/${{ github.repository }}/tree/$BRANCH"
      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-rundgang
          path: |
            out/bilder
            out/abstuerze
            out/rundgang.mp4
            out/app-protokoll.txt
            out/test.log
            out/ERGEBNIS.md
          retention-days: 14
      - name: Testergebnis
        if: steps.rundgang.outcome == 'failure'
        run: |
          cat out/ERGEBNIS.md
          exit 1
